spring.application.name=shop
spring.profiles.default=local

# Hibernate validates; Flyway owns schema changes.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=online_shop
spring.flyway.enabled=true
spring.flyway.default-schema=online_shop
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Do not expose stack traces or internal exception details to HTTP clients.
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# Order fulfillment strategy

shop.order.strategy=most-abundant
